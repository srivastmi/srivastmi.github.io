<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kimiya's Napa Valley 70.3 training plan — a 9-week bike-first build to a strong, happy finish.">
  <meta name="robots" content="noindex, nofollow">
  <title>Kimiya's Road to Napa 🦋</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#fdf7fb; --bg-grad-a:#fdeef6; --bg-grad-b:#eef6fb;
      --surface:#ffffff; --surface-2:#fdf4fa;
      --border:#f2e0ec; --border-strong:#e8cfe0;
      --text:#6b5764; --text-bright:#3f2f3b; --muted:#a995a4;
      --accent:#c46fb4; --accent-2:#7fb8d4; --accent-soft:#fbeaf6;
      --shadow:0 2px 14px rgba(196,111,180,.09);
      --shadow-lg:0 6px 28px rgba(196,111,180,.13);
    }
    html[data-theme="dark"]{
      --bg:#241c27; --bg-grad-a:#2e2033; --bg-grad-b:#1e2430;
      --surface:#2e2433; --surface-2:#362a3c;
      --border:#41334770; --border-strong:#4d3c54;
      --text:#d6c7d4; --text-bright:#f7eef5; --muted:#a08fa0;
      --accent:#e7a8db; --accent-2:#8fc6e0; --accent-soft:#3a2942;
      --shadow:0 2px 14px rgba(0,0,0,.28);
      --shadow-lg:0 6px 28px rgba(0,0,0,.36);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:'Quicksand',ui-rounded,system-ui,sans-serif;
      background:var(--bg); color:var(--text); line-height:1.6;
      -webkit-font-smoothing:antialiased; overflow-x:hidden;
    }
    body::before{
      content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
      background:
        radial-gradient(900px circle at 12% -5%, var(--bg-grad-a), transparent 62%),
        radial-gradient(800px circle at 92% 8%, var(--bg-grad-b), transparent 58%);
    }
    /* ── butterflies ─────────────────────────────── */
    .flutter{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
    .bf{position:absolute;opacity:.34;color:var(--accent);animation:drift linear infinite}
    .bf svg{display:block;animation:flap 1.5s ease-in-out infinite;transform-origin:50% 50%}
    @keyframes drift{
      0%{transform:translate3d(0,12vh,0) rotate(-8deg)}
      50%{transform:translate3d(9vw,-46vh,0) rotate(9deg)}
      100%{transform:translate3d(-2vw,-108vh,0) rotate(-6deg)}
    }
    @keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.58)}}
    @media (prefers-reduced-motion:reduce){
      .bf,.bf svg{animation:none}
      .bf:nth-child(n+4){display:none}
    }
    /* ── shell ───────────────────────────────────── */
    .wrap{max-width:800px;margin:0 auto;padding:1.6rem 1.15rem 3.5rem;position:relative}
    .theme-toggle{
      position:fixed;top:1rem;right:1rem;z-index:20;width:38px;height:38px;border-radius:50%;
      background:var(--surface);border:1px solid var(--border-strong);color:var(--accent);
      cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .18s
    }
    .theme-toggle:hover{transform:rotate(18deg) scale(1.07)}
    html[data-theme="dark"] .icon-sun,html[data-theme="light"] .icon-moon{display:none}
    .back-link{display:inline-block;margin-bottom:1.1rem;font-size:.82rem;color:var(--muted);text-decoration:none;font-weight:600}
    .back-link:hover{color:var(--accent)}
    /* ── header ──────────────────────────────────── */
    .hero{text-align:center;margin-bottom:1.5rem}
    .hero .kicker{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
    .hero h1{
      font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:2.5rem;line-height:1.12;
      margin:.35rem 0 .3rem;color:var(--text-bright)
    }
    .hero h1 .bfi{display:inline-block;vertical-align:-.12em;width:.85em;height:.85em;color:var(--accent);animation:flap 2.4s ease-in-out infinite}
    .hero .sub{font-size:.92rem;color:var(--muted);font-weight:500}
    .goal{
      background:var(--accent-soft);border:1px solid var(--border-strong);border-radius:18px;
      padding:.85rem 1.2rem;margin:1.1rem 0 1.4rem;text-align:center;
      font-size:.9rem;color:var(--text-bright);font-weight:500
    }
    .goal b{color:var(--accent)}
    /* ── countdown ───────────────────────────────── */
    .cd{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.15rem 1.3rem;box-shadow:var(--shadow);margin-bottom:1.1rem}
    .cd-top{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
    .cd-big{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;color:var(--text-bright)}
    .cd-big em{color:var(--accent);font-style:normal}
    .cd-lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
    .bar{height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;position:relative}
    .bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .7s ease}
    /* ── stat grid ───────────────────────────────── */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.1rem}
    .st{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:.8rem .5rem;text-align:center;box-shadow:var(--shadow)}
    .st .v{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;color:var(--text-bright)}
    .st .l{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-top:.15rem}
    /* ── benchmarks ──────────────────────────────── */
    .bench{display:grid;gap:.55rem;margin-bottom:1.3rem}
    .bm{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:.75rem .95rem;box-shadow:var(--shadow)}
    .bm .pip{width:11px;height:11px;border-radius:50%;margin-top:.42rem}
    .bm .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
    .bm .val{font-family:'Fraunces',serif;font-size:1.02rem;color:var(--text-bright);font-weight:600}
    .bm .nt{font-size:.81rem;color:var(--text)}
    .sec-title{font-family:'Fraunces',serif;font-size:1rem;color:var(--text-bright);font-weight:600;margin:0 0 .55rem;display:flex;align-items:center;gap:.4rem}
    .sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
    /* ── zones ───────────────────────────────────── */
    .zones{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.4rem}
    .zchip{font-size:.75rem;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:.3rem .8rem;color:var(--text)}
    .zchip b{color:var(--accent)}
    /* ── tabs ────────────────────────────────────── */
    .tabs{display:flex;gap:.35rem;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:.3rem;margin-bottom:1.4rem}
    .tab{flex:1;background:none;border:none;font-family:inherit;font-size:.86rem;font-weight:700;color:var(--muted);
      padding:.5rem .5rem;border-radius:99px;cursor:pointer;transition:.18s}
    .tab:hover{color:var(--text-bright)}
    .tab.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
    .view{display:none;animation:fade .3s ease}
    .view.active{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    /* ── week nav ────────────────────────────────── */
    .wknav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:1rem}
    .wkbtn{background:var(--surface);border:1px solid var(--border-strong);color:var(--accent);font-family:inherit;
      font-weight:700;font-size:.8rem;padding:.45rem .9rem;border-radius:99px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
    .wkbtn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow-lg)}
    .wkbtn:disabled{opacity:.32;cursor:default;box-shadow:none}
    .wkmid{text-align:center}
    .wkmid .t{font-family:'Fraunces',serif;font-size:.94rem;font-weight:600;color:var(--text-bright)}
    .wkjump{background:none;border:none;font-family:inherit;font-size:.71rem;color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
    .wkcur{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
    /* ── week card ───────────────────────────────── */
    .wk{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:1.15rem 1.3rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
    .wk.current{border-color:var(--accent);box-shadow:var(--shadow-lg)}
    .wk.race{border-color:#f2c14e;background:linear-gradient(160deg,var(--accent-soft),var(--surface))}
    .wk.stepback{background:linear-gradient(160deg,var(--surface-2),var(--surface))}
    .wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem;flex-wrap:wrap}
    .wkhead h3{font-family:'Fraunces',serif;font-size:1.06rem;margin:0;color:var(--text-bright);font-weight:600}
    .pill{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);
      background:var(--accent-soft);border-radius:99px;padding:.2rem .6rem;white-space:nowrap}
    .wkmeta{font-size:.76rem;color:var(--muted);margin:.1rem 0 .5rem;font-weight:600}
    .wkfocus{font-size:.85rem;color:var(--text);background:var(--surface-2);border-left:3px solid var(--accent);
      border-radius:0 10px 10px 0;padding:.5rem .8rem;margin-bottom:.7rem}
    .day{display:grid;grid-template-columns:44px 1fr;gap:.55rem;padding:.5rem 0;border-top:1px dashed var(--border)}
    .day:first-of-type{border-top:none}
    .dow{font-size:.73rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:.18rem}
    .sess{display:flex;flex-direction:column;gap:.4rem}
    .srow{display:grid;grid-template-columns:auto 1fr;gap:.5rem;align-items:start}
    .sdot{width:9px;height:9px;border-radius:50%;margin-top:.44rem}
    .sbody{font-size:.855rem}
    .stitle{color:var(--text-bright);font-weight:700}
    .sdet{color:var(--text)}
    .smeta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.18rem}
    .tag{font-size:.68rem;font-weight:700;border-radius:99px;padding:.08rem .55rem;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
    .tag.eff{color:var(--accent);background:var(--accent-soft);border-color:var(--border-strong)}
    /* ── legend ──────────────────────────────────── */
    .legend{display:flex;flex-wrap:wrap;gap:.65rem;font-size:.73rem;color:var(--muted);margin-bottom:1rem;font-weight:600}
    .legend span{display:inline-flex;align-items:center;gap:.32rem}
    .legend i{width:9px;height:9px;border-radius:50%}
    /* ── guide ───────────────────────────────────── */
    .gsec{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.05rem 1.25rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
    .gsec h3{font-family:'Fraunces',serif;font-size:1rem;color:var(--text-bright);margin:0 0 .45rem;font-weight:600;display:flex;align-items:center;gap:.45rem}
    .gsec h3 .bfi{width:1em;height:1em;color:var(--accent);flex-shrink:0}
    .gsec p{font-size:.875rem;margin:0;color:var(--text)}
    .loading{color:var(--muted);font-size:.9rem;padding:1.4rem 0;text-align:center}
    footer{text-align:center;font-size:.75rem;color:var(--muted);margin-top:2.2rem;font-weight:600}
    @media (max-width:560px){
      .hero h1{font-size:1.95rem}
      .stats{grid-template-columns:repeat(3,1fr)}
      .st .v{font-size:1rem}
      .wrap{padding-top:3.2rem}
      .day{grid-template-columns:38px 1fr}
    }
  </style>
</head>
<body>
  <div class="flutter" id="flutter" aria-hidden="true"></div>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark mode">
    <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1.5 12h2M20.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="bfly" viewBox="0 0 40 34">
      <path fill="currentColor" d="M19 13C11 3 3 6 4.5 14 6 20.5 14 19.5 19 16.5Z"/>
      <path fill="currentColor" opacity=".82" d="M19 18c-5.5 2.5-12 4.5-11 9 1 4 8 1.5 11-4.5Z"/>
      <path fill="currentColor" d="M21 13c8-10 16-7 14.5 1C34 20.5 26 19.5 21 16.5Z"/>
      <path fill="currentColor" opacity=".82" d="M21 18c5.5 2.5 12 4.5 11 9-1 4-8 1.5-11-4.5Z"/>
      <path fill="currentColor" d="M20 9.5c1 0 1.4 2.2 1.4 8.5s-.5 7.5-1.4 7.5-1.4-1.2-1.4-7.5.4-8.5 1.4-8.5Z"/>
      <path stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none" d="M19.5 10C18 7 16.2 6 14.6 5.6M20.5 10c1.5-3 3.3-4 4.9-4.4"/>
    </symbol>
  </svg>

  <div class="wrap">
    <a href="/" class="back-link">&larr; mihirsrivastava.com</a>

    <div class="hero">
      <div class="kicker">Training Plan</div>
      <h1>Kimiya&rsquo;s Road to Napa <svg class="bfi"><use href="#bfly"/></svg></h1>
      <p class="sub" id="hero-sub">&nbsp;</p>
    </div>

    <div class="goal" id="goal">&nbsp;</div>

    <div class="cd">
      <div class="cd-top">
        <div class="cd-big" id="cd-big">&nbsp;</div>
        <div class="cd-lbl" id="cd-lbl">&nbsp;</div>
      </div>
      <div class="bar"><span id="cd-bar" style="width:0%"></span></div>
    </div>

    <div class="stats" id="stats"></div>

    <h2 class="sec-title">Where you&rsquo;re starting</h2>
    <div class="bench" id="bench"></div>

    <h2 class="sec-title">Effort zones</h2>
    <div class="zones" id="zones"></div>

    <div class="tabs">
      <button class="tab active" data-view="week">This Week</button>
      <button class="tab" data-view="full">Full Plan</button>
      <button class="tab" data-view="guide">Guide</button>
    </div>

    <div class="view active" id="view-week"><div id="week-root"><div class="loading">Loading&hellip; 🦋</div></div></div>
    <div class="view" id="view-full">
      <div class="legend" id="legend"></div>
      <div id="full-root"></div>
    </div>
    <div class="view" id="view-guide"><div id="guide-root"></div></div>

    <footer>Made with 🦋 for Kimiya &middot; Napa Valley 70.3</footer>
  </div>

  <script>
  (function(){
    // theme
    var root=document.documentElement, tg=document.getElementById('theme-toggle');
    var saved=null; try{saved=localStorage.getItem('kimiya-theme');}catch(e){}
    root.setAttribute('data-theme', saved || 'light');
    tg.addEventListener('click',function(){
      var m = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
      root.setAttribute('data-theme',m);
      try{localStorage.setItem('kimiya-theme',m);}catch(e){}
    });

    // butterflies
    var f=document.getElementById('flutter'), N=7, html='';
    for(var i=0;i<N;i++){
      var left=(6+i*13.5+(i%3)*4)%94, size=16+(i%4)*9, dur=26+i*6, delay=-(i*7), op=(.14+(i%3)*.09).toFixed(2);
      html+='<div class="bf" style="left:'+left+'%;bottom:-14vh;opacity:'+op+';animation-duration:'+dur+'s;animation-delay:'+delay+'s">'
          + '<svg width="'+size+'" height="'+(size*0.85)+'" style="animation-duration:'+(1.2+(i%4)*.35)+'s"><use href="#bfly"/></svg></div>';
    }
    f.innerHTML=html;

    var SPORT={
      swim:{c:'#7fb8d4',l:'Swim'}, bike:{c:'#ef9694',l:'Bike'}, run:{c:'#86c99a',l:'Run'},
      brick:{c:'#b79ee0',l:'Brick'}, strength:{c:'#f2b280',l:'Strength'}, skill:{c:'#8fbfd8',l:'Prep'},
      rest:{c:'#c9bcc6',l:'Rest'}, race:{c:'#f2c14e',l:'Race'}
    };
    var esc=function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
    var TODAY=new Date();
    var dayMs=864e5;

    fetch('kimiya_plan.json').then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(function(data){
      var m=data.meta, weeks=data.weeks;
      var raceDate=new Date(m.date+'T07:00:00');

      document.getElementById('hero-sub').textContent =
        m.race+' · '+raceDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
      document.getElementById('goal').innerHTML='<b>The goal:</b> '+esc(m.goal);

      // countdown + progress
      var days=Math.ceil((raceDate-TODAY)/dayMs);
      var start=new Date(m.start_monday+'T00:00:00');
      var total=(raceDate-start)/dayMs, done=Math.min(Math.max((TODAY-start)/dayMs,0),total);
      var pct=total>0?Math.round(done/total*100):0;
      document.getElementById('cd-big').innerHTML = days>0
        ? '<em>'+days+'</em> days to go'
        : (days===0 ? '<em>Race day</em> 🦋' : 'You did it 🏅');
      document.getElementById('cd-lbl').textContent = days>0 ? pct+'% through the plan' : 'complete';
      setTimeout(function(){document.getElementById('cd-bar').style.width=(days>0?pct:100)+'%';},120);

      // stats
      document.getElementById('stats').innerHTML =
        '<div class="st"><div class="v">'+esc(m.distances.swim)+'</div><div class="l">Swim</div></div>'+
        '<div class="st"><div class="v">'+esc(m.distances.bike)+'</div><div class="l">Bike</div></div>'+
        '<div class="st"><div class="v">'+esc(m.distances.run)+'</div><div class="l">Run</div></div>';

      // benchmarks
      document.getElementById('bench').innerHTML=(data.benchmarks||[]).map(function(b){
        var c=(SPORT[b.sport]||{c:'#c9bcc6'}).c;
        return '<div class="bm"><span class="pip" style="background:'+c+'"></span><div>'+
          '<div class="lbl">'+esc(b.label)+'</div>'+
          '<div class="val">'+esc(b.value)+'</div>'+
          '<div class="nt">'+esc(b.note)+'</div></div></div>';
      }).join('');

      // zones
      document.getElementById('zones').innerHTML=(m.zones||[]).map(function(z){
        return '<span class="zchip"><b>'+esc(z.z)+'</b> '+esc(z.name)+' — '+esc(z.feel)+'</span>';
      }).join('');

      // legend
      document.getElementById('legend').innerHTML=Object.keys(SPORT).map(function(k){
        return '<span><i style="background:'+SPORT[k].c+'"></i>'+SPORT[k].l+'</span>';
      }).join('');

      // week helpers
      var wStart=function(w){return new Date(w.monday+'T00:00:00');};
      var wEnd=function(w){var d=wStart(w); d.setDate(d.getDate()+7); return d;};
      var curIdx=-1;
      for(var i=0;i<weeks.length;i++){ if(TODAY>=wStart(weeks[i]) && TODAY<wEnd(weeks[i])){curIdx=i;break;} }
      var upcoming=false;
      if(curIdx<0){
        if(TODAY<wStart(weeks[0])){curIdx=0;upcoming=true;} else {curIdx=weeks.length-1;}
      }

      function renderWeek(w,hilite,label){
        var cls='wk'+(w.block==='Race Week'?' race':'')+(w.stepback&&w.block!=='Race Week'?' stepback':'')+(hilite?' current':'');
        var mon=new Date(w.monday+'T12:00:00');
        var end=new Date(w.monday+'T12:00:00'); end.setDate(end.getDate()+6);
        var h='<div class="'+cls+'">'
          +'<div class="wkhead"><h3>Week '+w.n+' &middot; '+esc(w.block)+'</h3>'
          +'<span class="pill">'+esc(w.hours)+' hrs'+(w.stepback?' · easy':'')+'</span></div>'
          +'<div class="wkmeta">'+mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '
          +end.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(label?' &middot; '+label:'')+'</div>';
        if(w.focus) h+='<div class="wkfocus">'+esc(w.focus)+'</div>';
        w.days.forEach(function(d){
          h+='<div class="day"><div class="dow">'+esc(d.d)+'</div><div class="sess">';
          d.sessions.forEach(function(s){
            var sp=SPORT[s.sport]||{c:'#c9bcc6'};
            h+='<div class="srow"><span class="sdot" style="background:'+sp.c+'"></span><div class="sbody">'
              +'<span class="stitle">'+esc(s.title)+'</span>'
              +(s.detail?' <span class="sdet">— '+esc(s.detail)+'</span>':'')
              +'<div class="smeta">'
              +(s.dur&&s.dur!=='—'?'<span class="tag">'+esc(s.dur)+'</span>':'')
              +(s.effort&&s.effort!=='—'?'<span class="tag eff">'+esc(s.effort)+'</span>':'')
              +'</div></div></div>';
          });
          h+='</div></div>';
        });
        return h+'</div>';
      }

      // This Week (steppable)
      var viewIdx=curIdx, wr=document.getElementById('week-root');
      function renderThisWeek(){
        var w=weeks[viewIdx], onCur=(viewIdx===curIdx);
        var label = onCur ? (upcoming ? 'up next' : 'this week') : '';
        var h='<div class="wknav">'
          +'<button class="wkbtn" id="wk-prev"'+(viewIdx===0?' disabled':'')+'>&larr;</button>'
          +'<div class="wkmid"><div class="t">Week '+w.n+' of '+weeks.length+'</div>'
          +(onCur?'<div class="wkcur">'+label+'</div>'
                 :'<button class="wkjump" id="wk-jump">'+(upcoming?'Back to Week 1':'Jump to this week')+'</button>')
          +'</div>'
          +'<button class="wkbtn" id="wk-next"'+(viewIdx===weeks.length-1?' disabled':'')+'>&rarr;</button>'
          +'</div>';
        if(upcoming && onCur){
          var d0=Math.ceil((wStart(weeks[0])-TODAY)/dayMs);
          h+='<div class="goal">Training starts in <b>'+d0+' day'+(d0===1?'':'s')+'</b>. Here&rsquo;s Week 1 🦋</div>';
        }
        h+=renderWeek(w,onCur,label);
        wr.innerHTML=h;
        document.getElementById('wk-prev').onclick=function(){if(viewIdx>0){viewIdx--;renderThisWeek();}};
        document.getElementById('wk-next').onclick=function(){if(viewIdx<weeks.length-1){viewIdx++;renderThisWeek();}};
        var j=document.getElementById('wk-jump'); if(j) j.onclick=function(){viewIdx=curIdx;renderThisWeek();};
      }
      renderThisWeek();

      // Full plan
      document.getElementById('full-root').innerHTML=weeks.map(function(w,i){
        return renderWeek(w, i===curIdx, i===curIdx ? (upcoming?'up next':'this week') : '');
      }).join('');

      // Guide
      var g=data.guide||{};
      var titles={
        start_here:'Start here', bike:'The bike (read this one twice)', swim:'The swim',
        run:'The run', bricks:'Bricks — running off the bike', fuel:'Fuelling',
        gear:'Gear checklist', strength:'Strength', race_day_math:'Race-day math',
        race_day_pacing:'How to race it', listening:'When to back off', adjusting:'Adjusting the plan'
      };
      var order=['start_here','bike','swim','run','bricks','fuel','gear','strength','race_day_math','race_day_pacing','listening','adjusting'];
      document.getElementById('guide-root').innerHTML=order.filter(function(k){return g[k];}).map(function(k){
        return '<div class="gsec"><h3><svg class="bfi"><use href="#bfly"/></svg>'+esc(titles[k]||k)+'</h3><p>'+esc(g[k])+'</p></div>';
      }).join('');

    }).catch(function(e){
      console.error(e);
      document.getElementById('week-root').innerHTML='<div class="loading">Couldn&rsquo;t load the plan. Try a refresh.</div>';
    });

    document.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click',function(){
        document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
        document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active');});
        t.classList.add('active');
        document.getElementById('view-'+t.dataset.view).classList.add('active');
        window.scrollTo({top:document.querySelector('.tabs').offsetTop-70,behavior:'smooth'});
      });
    });
  })();
  </script>
</body>
</html>
