<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mihir's Napa Valley 70.3 training plan — 11-week periodized swim/bike/run build.">
  <meta name="author" content="Mihir Srivastava">
  <title>Napa 70.3 Plan — Mihir Srivastava</title>
  <link rel="icon" href="images/favicon.ico">
  <link rel="stylesheet" href="style.css">
  <style>
    .mh { margin-bottom: 1rem; }
    .mh h1 { font-size: 1.85rem; margin-bottom: 0.2rem; }
    .mh .sub { color: var(--text-muted); font-size: 0.95rem; }
    .back-link { display: inline-block; margin-bottom: 1.1rem; font-size: 0.88rem; color: var(--accent); }

    .race-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 0.7rem; margin: 1rem 0 1.25rem; }
    .rs { text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 0.7rem 0.4rem; }
    .rs .v { font-size: 1.15rem; font-weight: 700; color: var(--text-bright); }
    .rs .l { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-top: 0.15rem; }

    .countdown { background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 10px; padding: 0.7rem 1.1rem; margin-bottom: 1.25rem; font-size: 0.9rem; color: var(--text-bright); text-align: center; }

    .zones { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0 1.25rem; }
    .zone-chip { font-size: 0.74rem; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.25rem 0.6rem; }
    .zone-chip b { color: var(--accent); }

    .tabs { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .tab { background: none; border: none; color: var(--text-muted); font-size: 0.9rem; padding: 0.6rem 0.85rem; cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .view { display: none; }
    .view.active { display: block; }

    .wk-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 0.8rem; }
    .wk-card.current { border-color: var(--accent); }
    .wk-card.race { border-color: #e5b53c; background: var(--accent-dim); }
    .wk-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.15rem; }
    .wk-head h3 { font-size: 1rem; color: var(--text-bright); margin: 0; }
    .wk-block { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); font-weight: 700; }
    .wk-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .wk-focus { font-size: 0.83rem; color: var(--text); font-style: italic; margin-bottom: 0.6rem; }

    /* Week stepper */
    .wk-nav { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 1rem; }
    .wk-btn { background: var(--surface); border: 1px solid var(--border); color: var(--accent); font-family: inherit; font-size: 0.83rem; padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; transition: border-color .15s; }
    .wk-btn:hover:not(:disabled) { border-color: var(--accent); }
    .wk-btn:disabled { color: var(--text-muted); opacity: 0.4; cursor: default; }
    .wk-nav-mid { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
    .wk-nav-title { font-size: 0.85rem; font-weight: 700; color: var(--text-bright); }
    .wk-nav-cur { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
    .wk-jump { background: none; border: none; color: var(--text-muted); font-size: 0.72rem; cursor: pointer; text-decoration: underline; font-family: inherit; padding: 0; }
    .wk-jump:hover { color: var(--accent); }

    .day { display: grid; grid-template-columns: 42px 1fr; gap: 0.5rem; padding: 0.45rem 0; border-top: 1px solid var(--border); }
    .day:first-of-type { border-top: none; }
    .day .dow { font-size: 0.76rem; font-weight: 700; color: var(--text-muted); padding-top: 0.1rem; }
    .sess { display: flex; flex-direction: column; gap: 0.3rem; }
    .s-row { display: flex; align-items: baseline; gap: 0.5rem; font-size: 0.85rem; flex-wrap: wrap; }
    .s-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; position: relative; top: 5px; }
    .s-title { color: var(--text-bright); font-weight: 600; }
    .s-detail { color: var(--text); }
    .s-tag { font-size: 0.7rem; color: var(--text-muted); background: var(--border); border-radius: 4px; padding: 0 6px; margin-left: auto; white-space: nowrap; }
    .s-eff { font-size: 0.7rem; color: var(--accent); font-weight: 700; }

    .sport-legend { display: flex; flex-wrap: wrap; gap: 0.7rem; font-size: 0.74rem; color: var(--text-muted); margin: 0.3rem 0 1.1rem; }
    .sport-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .sport-legend .d { width: 9px; height: 9px; border-radius: 50%; }

    .guide-sec { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 0.8rem; }
    .guide-sec h3 { font-size: 0.92rem; color: var(--text-bright); margin: 0 0 0.4rem; text-transform: capitalize; }
    .guide-sec p { font-size: 0.87rem; color: var(--text); line-height: 1.55; margin: 0; }
    .loading { color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0; }

    @media screen and (max-width: 680px) { .race-stats { grid-template-columns: repeat(2,1fr); } }
  </style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="glow" id="glow"></div>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <div class="container">
    <a href="/training" class="back-link">&larr; Training system</a>
    <div class="mh">
      <h1 id="race-name">Napa 70.3</h1>
      <p class="sub" id="race-sub">&nbsp;</p>
    </div>

    <div class="countdown" id="countdown">&nbsp;</div>
    <div class="race-stats" id="race-stats"></div>
    <div class="zones" id="zones"></div>

    <div class="tabs">
      <button class="tab active" data-view="week">This Week</button>
      <button class="tab" data-view="full">Full Plan</button>
      <button class="tab" data-view="guide">Guide</button>
    </div>

    <div class="view active" id="view-week"><div id="week-root"><div class="loading">Loading&hellip;</div></div></div>
    <div class="view" id="view-full">
      <div class="sport-legend" id="sport-legend"></div>
      <div id="full-root"><div class="loading">Loading&hellip;</div></div>
    </div>
    <div class="view" id="view-guide"><div id="guide-root"><div class="loading">Loading&hellip;</div></div></div>

    <footer><span>&copy; 2026</span></footer>
  </div>

  <script>
    const toggle=document.getElementById('theme-toggle'),root=document.documentElement;
    const setTheme=m=>{root.setAttribute('data-theme',m);localStorage.setItem('theme',m);};
    setTheme(localStorage.getItem('theme')||'dark');
    toggle.addEventListener('click',()=>setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
    const glow=document.getElementById('glow');let mx=0,my=0,gx=0,gy=0,an=false;
    const lerp=(a,b,t)=>a+(b-a)*t;
    function animate(){gx=lerp(gx,mx,.08);gy=lerp(gy,my,.08);const dk=root.getAttribute('data-theme')==='dark';glow.style.background=`radial-gradient(600px circle at ${gx}px ${gy}px, ${dk?'rgba(212,160,84,0.06)':'rgba(212,160,84,0.045)'}, transparent 60%)`;requestAnimationFrame(animate);}
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!an){an=true;animate();}});
    if('ontouchstart' in window)glow.style.background='radial-gradient(600px circle at 50% 20%, rgba(212,160,84,0.04), transparent 60%)';

    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('view-'+t.dataset.view).classList.add('active');
    }));

    const TODAY=new Date();
    const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const SPORT={ swim:{c:'#6fa8c7',l:'Swim'}, bike:{c:'#d4a054',l:'Bike'}, run:{c:'#5fb96b',l:'Run'}, brick:{c:'#b490c7',l:'Brick'}, strength:{c:'#d98a4a',l:'Strength'}, skill:{c:'#6fa8c7',l:'Skill'}, rest:{c:'#8a8a8a',l:'Rest'}, race:{c:'#e5b53c',l:'Race'} };

    fetch('tri_plan.json').then(r=>r.json()).then(data=>{
      const m=data.meta;
      document.getElementById('race-name').textContent=m.race;
      const raceDate=new Date(m.date+'T08:00:00');
      document.getElementById('race-sub').textContent=raceDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' · '+m.weekly_hours;

      // Countdown
      const days=Math.ceil((raceDate-TODAY)/864e5);
      document.getElementById('countdown').innerHTML=days>0?`<strong>${days} days</strong> to race day · Race effort: ${esc(m.race_effort)}`:'Race complete 🏁';

      // Race stats
      document.getElementById('race-stats').innerHTML=
        `<div class="rs"><div class="v">${esc(m.distances.swim)}</div><div class="l">Swim</div></div>`+
        `<div class="rs"><div class="v">${esc(m.distances.bike)}</div><div class="l">Bike</div></div>`+
        `<div class="rs"><div class="v">${esc(m.distances.run)}</div><div class="l">Run</div></div>`+
        `<div class="rs"><div class="v">${data.weeks.length} wks</div><div class="l">Plan</div></div>`;

      // Zones
      document.getElementById('zones').innerHTML=(m.zones||[]).map(z=>`<span class="zone-chip"><b>${esc(z.z)}</b> ${esc(z.name)} — ${esc(z.feel)}</span>`).join('');

      // Sport legend
      document.getElementById('sport-legend').innerHTML=Object.keys(SPORT).map(k=>`<span><span class="d" style="background:${SPORT[k].c}"></span>${SPORT[k].l}</span>`).join('');

      // Current week detection
      const weekStart=w=>new Date(w.monday+'T00:00:00');
      const weekEnd=w=>{const d=new Date(w.monday+'T00:00:00');d.setDate(d.getDate()+7);return d;};
      let cur=data.weeks.find(w=>TODAY>=weekStart(w)&&TODAY<weekEnd(w));
      let upcoming=false;
      if(!cur){ if(TODAY<weekStart(data.weeks[0])){cur=data.weeks[0];upcoming=true;} else {cur=data.weeks[data.weeks.length-1];} }

      const renderWeek=(w,isCur)=>{
        const cls='wk-card'+(w.block==='Race Week'?' race':'')+(isCur?' current':'');
        let h=`<div class="${cls}"><div class="wk-head"><h3>Week ${w.n} — ${esc(w.block)}${isCur&&!upcoming?' · this week':''}</h3><span class="wk-block">${esc(w.hours)} hrs${w.stepback?' · step-back':''}</span></div>`;
        const mon=new Date(w.monday+'T12:00:00');
        h+=`<div class="wk-meta">Week of ${mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>`;
        if(w.focus)h+=`<div class="wk-focus">${esc(w.focus)}</div>`;
        w.days.forEach(d=>{
          h+=`<div class="day"><div class="dow">${esc(d.d)}</div><div class="sess">`;
          d.sessions.forEach(s=>{
            const sp=SPORT[s.sport]||{c:'#888'};
            h+=`<div class="s-row"><span class="s-dot" style="background:${sp.c}"></span><span><span class="s-title">${esc(s.title)}</span>${s.detail?` — <span class="s-detail">${esc(s.detail)}</span>`:''} ${s.effort&&s.effort!=='—'?`<span class="s-eff">${esc(s.effort)}</span>`:''}</span>${s.dur&&s.dur!=='—'?`<span class="s-tag">${esc(s.dur)}</span>`:''}</div>`;
          });
          h+=`</div></div>`;
        });
        h+=`</div>`;
        return h;
      };

      // This Week — steppable (prev/next through past & future weeks)
      const curIdx=data.weeks.indexOf(cur);
      let viewIdx=curIdx;
      const weekRoot=document.getElementById('week-root');
      function renderThisWeek(){
        const w=data.weeks[viewIdx];
        const isCur=(viewIdx===curIdx);
        let h=`<div class="wk-nav">`+
          `<button class="wk-btn" id="wk-prev"${viewIdx===0?' disabled':''}>&larr; Prev</button>`+
          `<div class="wk-nav-mid"><span class="wk-nav-title">Week ${w.n} of ${data.weeks.length}</span>`+
          ((isCur&&!upcoming)?`<span class="wk-nav-cur">this week</span>`:`<button class="wk-jump" id="wk-jump">Jump to ${upcoming?'Week 1':'current week'}</button>`)+
          `</div>`+
          `<button class="wk-btn" id="wk-next"${viewIdx===data.weeks.length-1?' disabled':''}>Next &rarr;</button>`+
          `</div>`;
        if(upcoming&&isCur){const dstart=Math.ceil((weekStart(cur)-TODAY)/864e5);h+=`<div class="countdown" style="margin-bottom:1rem">Build starts in <strong>${dstart} days</strong>. You're in marathon recovery until then — here's Week 1:</div>`;}
        h+=renderWeek(w,isCur&&!upcoming);
        weekRoot.innerHTML=h;
        const pb=document.getElementById('wk-prev'),nb=document.getElementById('wk-next'),jb=document.getElementById('wk-jump');
        pb.onclick=()=>{if(viewIdx>0){viewIdx--;renderThisWeek();}};
        nb.onclick=()=>{if(viewIdx<data.weeks.length-1){viewIdx++;renderThisWeek();}};
        if(jb)jb.onclick=()=>{viewIdx=curIdx;renderThisWeek();};
      }
      renderThisWeek();

      // Full Plan
      document.getElementById('full-root').innerHTML=data.weeks.map(w=>renderWeek(w,w.n===cur.n)).join('');

      // Guide
      const g=data.guide||{};
      const order=['bricks','swim','bike','fuel','strength','knee'];
      let gh=order.filter(k=>g[k]).map(k=>`<div class="guide-sec"><h3>${k}</h3><p>${esc(g[k])}</p></div>`).join('');
      if(data.gym){
        gh+=`<div class="guide-sec"><h3>Gym — example split</h3><p style="margin-bottom:0.7rem">${esc(data.gym.note)}</p>`+
          data.gym.sessions.map(s=>`<div style="margin-bottom:0.8rem"><div style="font-weight:700;color:var(--text-bright);font-size:0.86rem;margin-bottom:0.3rem">${esc(s.name)}</div><ul style="margin:0;padding-left:1.1rem">${s.lifts.map(l=>`<li style="font-size:0.84rem;color:var(--text);line-height:1.5">${esc(l)}</li>`).join('')}</ul></div>`).join('')+
          `</div>`;
      }
      document.getElementById('guide-root').innerHTML=gh;

    }).catch(e=>{document.getElementById('week-root').innerHTML='<div class="loading">Could not load plan.</div>';console.error(e);});
  </script>
</body>
</html>
